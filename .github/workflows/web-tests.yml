name: Web Tests on PR
on:
  pull_request:
    branches:
      - main
jobs:
  run-web-tests:
    runs-on: ubuntu-latest
    services:
      selenium:
        image: selenium/standalone-chrome:latest
        ports:
          - 4444:4444
        options: --shm-size="2g"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Run Web Tests
        run: xvfb-run mvn clean test -Dsuite=src/test/resources/desktop-testing.xml